# port.conf - describes this port to tools/port.sh and to CI. Shell syntax: no spaces around "=".
# Before the first build run tools/make_assets.sh: it makes assets/ and src/gen_* from original/$GAME.nes.

GAME=llb                                    # the ROM is original/$GAME.nes, its knowledge tools/games/$GAME.py
NAME=llb                                    # program name inside dist/
SOURCES="kit/sys.c kit/disp.c kit/perf.c src/main.c src/video.c src/video68k.s src/sound.c src/logic.c src/nes.c src/run68k.c src/coro.s src/data.s src/gen68k.s"
CFLAGS="-Ikit -Isrc"

TICKS=3000                                  # logic ticks (NES frames) for the bench
CLASS=planar                                # must hold 50 Hz: late=0 and worst_pct <= 80

HOST_TEST="src/host_test.c src/host_render.c src/logic.c src/nes.c src/run_c.c src/coro_host.c src/gen_dispatch.c src/gen_bank0.c src/gen_bank1.c src/gen_bank2.c src/gen_bank3.c src/gen_bank4.c src/gen_bank5.c src/gen_bank6.c src/gen_bank7.c"
HOST_CFLAGS="-Isrc"
